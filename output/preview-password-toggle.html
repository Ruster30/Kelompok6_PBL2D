<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preview Password Toggle</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg-dark: #0d1117; --bg-panel: #111827; --bg-input: #1a2233;
  --border-color: #2a3448; --text-primary: #f0f4ff; --text-secondary: #8a99b3;
  --text-muted: #5a6882; --accent: #0ecab4;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:"Plus Jakarta Sans",sans-serif; background:var(--bg-dark); color:var(--text-primary); display:flex; min-height:100vh; align-items:center; justify-content:center; }

.card {
  background:var(--bg-panel); border:1px solid var(--border-color); border-radius:20px;
  padding:40px; width:420px; max-width:90vw;
}
.card h2 { font-size:22px; font-weight:700; margin-bottom:6px; }
.card p { font-size:14px; color:var(--text-secondary); margin-bottom:28px; }

.form-group { margin-bottom:20px; }
.form-label { display:block; font-size:13px; font-weight:600; color:var(--text-secondary); margin-bottom:8px; }

.input-wrap { position:relative; }
.input-wrap .input-icon {
  position:absolute; left:16px; top:50%; transform:translateY(-50%);
  color:var(--text-muted); font-size:16px; pointer-events:none;
}

.form-control {
  width:100%; padding:14px 42px 14px 48px; background:var(--bg-input);
  border:1.5px solid var(--border-color); border-radius:12px;
  color:var(--text-primary); font-size:15px; font-family:inherit;
  outline:none; transition:border-color 0.25s;
}
.form-control:focus { border-color:var(--accent); }
.form-control:focus ~ .input-icon { color:var(--accent); }
.input-wrap:focus-within .input-icon { color:var(--accent); }

.toggle-password {
  position:absolute; right:4px; top:50%; transform:translateY(-50%);
  background:none; border:none; color:var(--text-muted); cursor:pointer;
  padding:10px 14px; font-size:18px; display:flex; align-items:center;
  transition:color 0.2s;
}
.toggle-password:hover { color:var(--text-secondary); }

.btn-primary {
  width:100%; padding:14px; background:var(--accent); color:#0a0f1a;
  border:none; border-radius:12px; font-size:15px; font-weight:700; cursor:pointer;
  font-family:inherit; transition:opacity 0.2s; display:flex; align-items:center;
  justify-content:center; gap:8px;
}
.btn-primary:hover { opacity:0.9; }
</style>
</head>
<body>
<div class="card">
  <h2>Ganti Password</h2>
  <p>Masukkan password baru untuk akun Anda.</p>

  <div class="form-group">
    <label class="form-label">Password Baru</label>
    <div class="input-wrap">
      <i class="bi bi-lock-fill input-icon"></i>
      <input type="password" id="password" class="form-control" placeholder="Min. 8 karakter" oninput="checkStrength(this.value)">
      <button type="button" class="toggle-password" onclick="togglePassword('password', this)" tabindex="-1">
        <i class="bi bi-eye-slash"></i>
      </button>
    </div>
    <div style="margin-top:8px;height:4px;background:var(--bg-dark);border-radius:4px;overflow:hidden;">
      <div id="strengthBar" style="height:100%;width:0;border-radius:4px;transition:all 0.3s;"></div>
    </div>
    <div id="strengthLabel" style="font-size:12px;margin-top:4px;color:var(--text-muted);"></div>
  </div>

  <div class="form-group">
    <label class="form-label">Konfirmasi Password</label>
    <div class="input-wrap">
      <i class="bi bi-lock-fill input-icon"></i>
      <input type="password" id="password_confirmation" class="form-control" placeholder="Ulangi password" oninput="checkMatch()">
      <button type="button" class="toggle-password" onclick="togglePassword('password_confirmation', this)" tabindex="-1">
        <i class="bi bi-eye-slash"></i>
      </button>
    </div>
    <div id="matchError" style="display:none;font-size:12px;color:#ef4444;margin-top:6px;">
      <i class="bi bi-exclamation-circle"></i> Password tidak cocok
    </div>
  </div>

  <button class="btn-primary"><i class="bi bi-check-lg"></i> Simpan Password</button>

  <div style="margin-top:24px;padding:12px 16px;background:var(--bg-dark);border-radius:10px;">
    <p style="font-size:12px;color:var(--text-secondary);">
      <i class="bi bi-info-circle"></i> Klik ikon <i class="bi bi-eye-slash"></i> di dalam input untuk toggle lihat/sembunyikan password.
    </p>
  </div>
</div>

<script>
function togglePassword(fieldId, btn) {
  const field = document.getElementById(fieldId);
  const icon = btn.querySelector("i");
  if (field.type === "password") {
    field.type = "text";
    icon.classList.replace("bi-eye-slash", "bi-eye");
  } else {
    field.type = "password";
    icon.classList.replace("bi-eye", "bi-eye-slash");
  }
}

function checkStrength(val) {
  const bar = document.getElementById("strengthBar");
  const label = document.getElementById("strengthLabel");
  if (!val) { bar.style.width = "0"; label.textContent = ""; return; }
  let score = 0;
  if (val.length >= 8) score++;
  if (/[A-Z]/.test(val)) score++;
  if (/[0-9]/.test(val)) score++;
  if (/[^A-Za-z0-9]/.test(val)) score++;
  const map = [
    { w:"25%",c:"#ef4444",t:"Lemah" },
    { w:"50%",c:"#f97316",t:"Cukup" },
    { w:"75%",c:"#eab308",t:"Baik" },
    { w:"100%",c:"#22c55e",t:"Kuat" },
  ];
  const l = map[Math.max(0,score-1)];
  bar.style.width = l.w; bar.style.background = l.c;
  label.textContent = l.t; label.style.color = l.c;
}

function checkMatch() {
  const pw = document.getElementById("password").value;
  const cpw = document.getElementById("password_confirmation").value;
  const err = document.getElementById("matchError");
  err.style.display = (cpw.length > 0 && pw !== cpw) ? "block" : "none";
}
</script>
</body>
</html>
