<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 550" font-family="'DejaVu Sans', 'Helvetica', Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.06"/>
    </filter>
    <filter id="shadowCard" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1100" height="550" fill="#f5f6fa" rx="8"/>

  <!-- ===== HEADER SECTION ===== -->
  <!-- Header row: Logo | Title | Info Card -->
  <rect x="40" y="24" width="1020" height="76" rx="0" fill="none"/>

  <!-- Logo area (left) -->
  <rect x="40" y="30" width="70" height="70" rx="14" fill="#0f172a"/>
  <text x="75" y="76" text-anchor="middle" fill="#14b8a6" font-size="30" font-weight="800">A</text>
  <text x="40" y="115" fill="#0f172a" font-size="9" font-weight="700">ALPHA CORP</text>

  <!-- Title (center) -->
  <text x="550" y="56" text-anchor="middle" fill="#0f172a" font-size="20" font-weight="800" letter-spacing="2">EVENT ANALYTICS REPORT</text>
  <text x="550" y="76" text-anchor="middle" fill="#64748b" font-size="10" font-weight="500">Ringkasan Performa Bisnis &amp; Operasional</text>

  <!-- Info card (right) - WITHOUT icon -->
  <rect x="880" y="32" width="180" height="62" rx="6" fill="white" stroke="#e2e8f0" stroke-width="1" filter="url(#shadowCard)"/>
  <text x="894" y="48" fill="#94a3b8" font-size="7" font-weight="600" letter-spacing="1">PERIODE LAPORAN</text>
  <text x="894" y="64" fill="#0f172a" font-size="10" font-weight="700">Tahun 2025</text>
  <line x1="894" y1="70" x2="1046" y2="70" stroke="#e2e8f0" stroke-width="1"/>
  <text x="894" y="82" fill="#94a3b8" font-size="7" font-weight="600" letter-spacing="1">TANGGAL CETAK</text>
  <text x="894" y="90" fill="#0f172a" font-size="10" font-weight="700">09 Juli 2025</text>

  <!-- Header divider line -->
  <line x1="40" y1="108" x2="1060" y2="108" stroke="#14b8a6" stroke-width="2"/>
  <line x1="40" y1="110" x2="1060" y2="110" stroke="#e2e8f0" stroke-width="1"/>

  <!-- ===== STAT CARDS ROW (8 cards, aligned with header) ===== -->
  <text x="40" y="145" fill="#94a3b8" font-size="9" font-weight="600" letter-spacing="1">■ RINGKASAN STATISTIK</text>

  <!-- Row of 8 stat cards -->
  <!-- Card 1 -->
  <rect x="40" y="152" width="116" height="58" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1" filter="url(#shadowCard)"/>
  <rect x="50" y="160" width="32" height="32" rx="8" fill="#dbeafe"/>
  <text x="66" y="180" text-anchor="middle" fill="#1e40af" font-size="14">📅</text>
  <text x="92" y="170" fill="#64748b" font-size="7" font-weight="600" letter-spacing="0.5">TOTAL EVENT</text>
  <text x="92" y="192" fill="#0f172a" font-size="13" font-weight="700">48</text>

  <!-- Card 2 -->
  <rect x="164" y="152" width="116" height="58" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1" filter="url(#shadowCard)"/>
  <rect x="174" y="160" width="32" height="32" rx="8" fill="#fed7aa"/>
  <text x="190" y="180" text-anchor="middle" fill="#9a3412" font-size="14">⚡</text>
  <text x="216" y="170" fill="#64748b" font-size="7" font-weight="600" letter-spacing="0.5">EVENT BERJALAN</text>
  <text x="216" y="192" fill="#0f172a" font-size="13" font-weight="700">12</text>

  <!-- Card 3 -->
  <rect x="288" y="152" width="116" height="58" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1" filter="url(#shadowCard)"/>
  <rect x="298" y="160" width="32" height="32" rx="8" fill="#d1fae5"/>
  <text x="314" y="180" text-anchor="middle" fill="#065f46" font-size="14">✓</text>
  <text x="340" y="170" fill="#64748b" font-size="7" font-weight="600" letter-spacing="0.5">EVENT SELESAI</text>
  <text x="340" y="192" fill="#0f172a" font-size="13" font-weight="700">28</text>

  <!-- Card 4 -->
  <rect x="412" y="152" width="116" height="58" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1" filter="url(#shadowCard)"/>
  <rect x="422" y="160" width="32" height="32" rx="8" fill="#e9d5ff"/>
  <text x="438" y="180" text-anchor="middle" fill="#6b21a8" font-size="14">👥</text>
  <text x="464" y="170" fill="#64748b" font-size="7" font-weight="600" letter-spacing="0.5">TOTAL CLIENT</text>
  <text x="464" y="192" fill="#0f172a" font-size="13" font-weight="700">24</text>

  <!-- Card 5 -->
  <rect x="536" y="152" width="116" height="58" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1" filter="url(#shadowCard)"/>
  <rect x="546" y="160" width="32" height="32" rx="8" fill="#dbeafe"/>
  <text x="562" y="180" text-anchor="middle" fill="#1e40af" font-size="14">🤝</text>
  <text x="588" y="170" fill="#64748b" font-size="7" font-weight="600" letter-spacing="0.5">TOTAL VENDOR</text>
  <text x="588" y="192" fill="#0f172a" font-size="13" font-weight="700">18</text>

  <!-- Card 6 -->
  <rect x="660" y="152" width="116" height="58" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1" filter="url(#shadowCard)"/>
  <rect x="670" y="160" width="32" height="32" rx="8" fill="#fed7aa"/>
  <text x="686" y="180" text-anchor="middle" fill="#9a3412" font-size="14">📄</text>
  <text x="712" y="170" fill="#64748b" font-size="7" font-weight="600" letter-spacing="0.5">TOTAL INVOICE</text>
  <text x="712" y="192" fill="#0f172a" font-size="13" font-weight="700">36</text>

  <!-- Card 7 -->
  <rect x="784" y="152" width="116" height="58" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1" filter="url(#shadowCard)"/>
  <rect x="794" y="160" width="32" height="32" rx="8" fill="#d1fae5"/>
  <text x="810" y="180" text-anchor="middle" fill="#065f46" font-size="14">💰</text>
  <text x="836" y="170" fill="#64748b" font-size="7" font-weight="600" letter-spacing="0.5">TOTAL PENDAPATAN</text>
  <text x="836" y="192" fill="#0f172a" font-size="13" font-weight="700">Rp 2.1 M</text>

  <!-- Card 8 -->
  <rect x="908" y="152" width="116" height="58" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1" filter="url(#shadowCard)"/>
  <rect x="918" y="160" width="32" height="32" rx="8" fill="#e9d5ff"/>
  <text x="934" y="180" text-anchor="middle" fill="#6b21a8" font-size="14">✓✓</text>
  <text x="960" y="170" fill="#64748b" font-size="7" font-weight="600" letter-spacing="0.5">PEMBAYARAN LUNAS</text>
  <text x="960" y="192" fill="#0f172a" font-size="13" font-weight="700">30</text>

  <!-- ===== SECTION: CHARTS AREA ===== -->
  <text x="40" y="235" fill="#0f172a" font-size="11" font-weight="700" padding="5 12">
    <rect x="36" y="224" width="4" height="16" rx="2" fill="#14b8a6"/>
  </text>
  <rect x="40" y="224" width="4" height="16" rx="2" fill="#14b8a6"/>
  <rect x="48" y="224" width="200" height="16" rx="4" fill="#f1f5f9"/>
  <text x="56" y="236" fill="#0f172a" font-size="10" font-weight="700">■ Analitik Grafik 2025</text>

  <!-- Charts 2x2 grid -->
  <!-- Chart 1 - Line -->
  <rect x="40" y="248" width="490" height="190" rx="10" fill="white" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)"/>
  <text x="50" y="268" fill="#0f172a" font-size="10" font-weight="700">● Pendapatan per Bulan</text>
  <!-- Line chart placeholder -->
  <polyline points="60,400 100,380 140,350 180,370 220,320 260,300 300,340 340,280 380,310 420,290 460,270 500,250" fill="none" stroke="#14b8a6" stroke-width="2.5" transform="translate(0, -55)"/>
  <circle cx="60" cy="345" r="3" fill="#14b8a6" transform="translate(0, -55)"/>
  <circle cx="100" cy="325" r="3" fill="#14b8a6" transform="translate(0, -55)"/>
  <circle cx="140" cy="295" r="3" fill="#14b8a6" transform="translate(0, -55)"/>
  <circle cx="180" cy="315" r="3" fill="#14b8a6" transform="translate(0, -55)"/>
  <circle cx="220" cy="265" r="3" fill="#14b8a6" transform="translate(0, -55)"/>
  <circle cx="260" cy="245" r="3" fill="#14b8a6" transform="translate(0, -55)"/>
  <circle cx="300" cy="285" r="3" fill="#14b8a6" transform="translate(0, -55)"/>
  <circle cx="340" cy="225" r="3" fill="#14b8a6" transform="translate(0, -55)"/>
  <circle cx="380" cy="255" r="3" fill="#14b8a6" transform="translate(0, -55)"/>
  <circle cx="420" cy="235" r="3" fill="#14b8a6" transform="translate(0, -55)"/>
  <circle cx="460" cy="215" r="3" fill="#14b8a6" transform="translate(0, -55)"/>
  <circle cx="500" cy="195" r="3" fill="#14b8a6" transform="translate(0, -55)"/>

  <!-- Chart 2 - Bar -->
  <rect x="542" y="248" width="490" height="190" rx="10" fill="white" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)"/>
  <text x="552" y="268" fill="#0f172a" font-size="10" font-weight="700">● Event per Bulan</text>
  <!-- Bar chart placeholder -->
  <rect x="562" y="330" width="22" height="45" rx="2" fill="#3b82f6" opacity="0.8"/>
  <rect x="592" y="310" width="22" height="65" rx="2" fill="#3b82f6" opacity="0.8"/>
  <rect x="622" y="340" width="22" height="35" rx="2" fill="#3b82f6" opacity="0.8"/>
  <rect x="652" y="320" width="22" height="55" rx="2" fill="#3b82f6" opacity="0.8"/>
  <rect x="682" y="300" width="22" height="75" rx="2" fill="#3b82f6" opacity="0.8"/>
  <rect x="712" y="280" width="22" height="95" rx="2" fill="#3b82f6" opacity="0.8"/>
  <rect x="742" y="290" width="22" height="85" rx="2" fill="#3b82f6" opacity="0.8"/>
  <rect x="772" y="270" width="22" height="105" rx="2" fill="#3b82f6" opacity="0.8"/>
  <rect x="802" y="295" width="22" height="80" rx="2" fill="#3b82f6" opacity="0.8"/>
  <rect x="832" y="310" width="22" height="65" rx="2" fill="#3b82f6" opacity="0.8"/>
  <rect x="862" y="285" width="22" height="90" rx="2" fill="#3b82f6" opacity="0.8"/>
  <rect x="892" y="325" width="22" height="50" rx="2" fill="#3b82f6" opacity="0.8"/>

  <!-- ===== ARROWS & ANNOTATIONS ===== -->

  <!-- LEFT alignment arrow for logo -->
  <line x1="40" y1="116" x2="40" y2="150" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="4,3"/>
  <line x1="40" y1="130" x2="160" y2="130" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="50" y="128" fill="#ff6b6b" font-size="8" font-weight="600">← Logo &amp; header sejajar kiri dengan card →</text>

  <!-- CENTER annotation for title -->
  <line x1="550" y1="96" x2="550" y2="148" stroke="#14b8a6" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="550" y="142" text-anchor="middle" fill="#14b8a6" font-size="8" font-weight="600">↑ Judul di tengah</text>

  <!-- RIGHT annotation for info card -->
  <line x1="1060" y1="116" x2="1060" y2="150" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="4,3"/>
  <line x1="880" y1="130" x2="1060" y2="130" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="890" y="128" fill="#ff6b6b" font-size="8" font-weight="600">Info card tanpa icon, sejajar kanan →</text>

  <!-- CENTER ALIGNMENT all content -->
  <rect x="38" y="22" width="1024" height="2" rx="1" fill="#ff6b6b" opacity="0.4"/>
  <rect x="38" y="218" width="1024" height="2" rx="1" fill="#ff6b6b" opacity="0.4"/>
  <text x="550" y="216" text-anchor="middle" fill="#ff6b6b" font-size="8" font-weight="600">── Semua konten dalam wrapper centering (max-width 1100px) ──</text>
</svg>
